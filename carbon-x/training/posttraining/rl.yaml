# Model arguments
model_name_or_path: HuggingFaceBio/Carbon-X-SFT
model_revision: main
dataset_name: HuggingFaceBio/FineDNA-RL
dataset_num_proc: 12

reward_funcs:
- vepqa_task
- vepqa_groundedness_penalty_task
- bioreason_task
- basic_dna_task
- bio_mcq_task
- genomeqa_task
- if_task
- dna_skills_task
- seqrecqa_position_task

# Trainer config
bf16: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
chat_template_kwargs:
  enable_thinking: false
num_generations: 16
temperature: 1.0
top_p: 1.0
top_k: -1
max_completion_length: 4096
token_budget: 16384
per_device_train_batch_size: 1
# Sized for 1+1 nodes.
gradient_accumulation_steps: 67
max_inflight_tasks: 512
max_staleness: 4
request_timeout: 1800
weight_sync_steps: 1
# DAPO Clip-Higher, section 4.1: https://huggingface.co/papers/2503.14476
epsilon: 0.2
epsilon_high: 0.28
learning_rate: 1.0e-06
adam_beta2: 0.95
# One pass over the blend is ~153 steps. Re-roll and re-calibrate the pools after it rather than train on prompts the
# policy may already solve
num_train_epochs: 1
max_grad_norm: 0.2
save_strategy: steps
# Each save stalls training ~19 min, so saving every 30 steps keeps the epoch at ~18 h on 1+1 nodes; the epoch stop
# also saves the final step
save_steps: 30
save_total_limit: 2
logging_steps: 1
log_level: info
log_completions: true
num_completions_to_print: 0
hub_model_id: Carbon-X-RL
hub_strategy: every_save
output_dir: scratch/Carbon-X-RL
push_to_hub: true
hub_private_repo: true
report_to:
- trackio
trackio_space_id: carbon-x-experiments
project: rl
seed: 42
trust_remote_code: true

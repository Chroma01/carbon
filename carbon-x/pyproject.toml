[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-x"
version = "0.0.0"
description = "Carbon-X training recipe and evaluation"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
  "accelerate==1.13.0",
  "datasets>=4.7.0",
  "huggingface-hub[hf_xet]>=1.27.0",
  "pandas",
  "safetensors",
  "trackio>=0.42.0",
  "transformers[kernels]==5.12.1",
  "trl==1.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
default-groups = ["sft", "rl", "evaluation"]

[dependency-groups]
sft = [
  "deepspeed==0.18.9",
  "liger-kernel",
]
rl = [
  "vllm==0.25.1",
  # NeMo Gym's instruction-following checker, which scores the IFEval and IFBench constraints of Nemotron-RL-IF
  "absl-py==2.5.0",
  "immutabledict",
  "instruction-following-eval @ git+https://github.com/josejg/instruction_following_eval.git@0c495b2",
  "langdetect",
  # NLTK 3.10 rejects the custom data path IFEval uses to download Punkt resources
  "nltk==3.9.2",
  "verifiable-instructions @ git+https://github.com/abukharin-nv/verifiable-instructions.git@f46a5ac87b1400a4f8973039844b6be9b56e3faf",
]
evaluation = [
  "inspect-ai>=0.3.272",
  "vllm==0.25.1",
]

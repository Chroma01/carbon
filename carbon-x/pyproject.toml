[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-x"
version = "0.0.0"
description = "Carbon-X training recipe and evaluation"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
  "accelerate==1.13.0",
  "datasets>=4.7.0",
  # declared explicitly: it was previously only pulled in transitively by the rl/sft groups, so a tokenization-only
  # install silently had no torch
  "torch>=2.6.0",
  # tokenization of the midtraining corpora (training/midtraining/tokenization)
  "datatrove[io,processing]>=0.7.0",
  "huggingface-hub[hf_xet]>=1.27.0",
  "pandas",
  "safetensors",
  "trackio>=0.42.0",
  "transformers[kernels]==5.12.1",
  "trl==1.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
default-groups = ["sft", "rl", "evaluation"]

[dependency-groups]
sft = [
  "deepspeed==0.18.9",
  "liger-kernel",
]
rl = [
  "vllm==0.25.1",
  # NeMo Gym's instruction-following checker, which scores the IFEval and IFBench constraints of FineDNA-RL's IF rows
  "absl-py==2.5.0",
  "immutabledict",
  "instruction-following-eval @ git+https://github.com/josejg/instruction_following_eval.git@0c495b2",
  "langdetect",
  # NLTK 3.10 rejects the custom data path IFEval uses to download Punkt resources
  "nltk==3.9.2",
  "verifiable-instructions @ git+https://github.com/abukharin-nv/verifiable-instructions.git@f46a5ac87b1400a4f8973039844b6be9b56e3faf",
]
# Installed on its own in HF Jobs evals, so it lists everything the Inspect tasks need. GPU jobs reuse vLLM from the
# vllm/vllm-openai image and the rl group pins it for local runs.
evaluation = [
  "datasets>=4.7.0",
  "huggingface-hub[hf_xet]>=1.27.0",
  "inspect-ai>=0.3.272",
  # Inspect model providers
  "anthropic",
  "google-genai",
  "openai>=2.40.0",
]
